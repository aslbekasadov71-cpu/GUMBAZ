<title>Ulgurji Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/*__BASE__*/
/* ── admin ── */
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app.nonav{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.bars{display:flex;gap:8px;height:150px;align-items:flex-end;background:var(--card);border-radius:18px;padding:14px 14px 10px;margin-bottom:8px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.bars i{width:100%;background:var(--bl);border-radius:8px 8px 4px 4px;min-height:4px;transition:height .5s var(--ease)}
.bars div.today i{background:var(--b)}
.bars small{font-size:11px;font-weight:700}
.bars em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.rank{width:30px;height:30px;border-radius:10px;background:var(--bl);color:var(--b);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.pbar{height:6px;border-radius:99px;background:var(--bl);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--b);border-radius:99px;transition:width .6s var(--ease)}
.acc{display:flex;align-items:center;gap:12px}
.oc{align-items:flex-start;position:relative}
.oc.fresh::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--warn)}
.oc .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc .hd b{font-size:16px;font-weight:800}
.oc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.oc .ft b{font-weight:800;white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .btn.big{grid-column:1/-1}
.pr-row .ico.im{width:58px;height:48px;border-radius:12px}
.pr-row .grow b{white-space:nowrap}
.pr-row.off .ico.im img{filter:grayscale(1);opacity:.6}
.mv{display:flex;flex-direction:column;gap:2px;flex:none}
.mv button{width:34px;height:26px;border-radius:8px;border:0;background:var(--bg);color:var(--b);display:grid;place-items:center}
.mv button:disabled{opacity:.3}
.photo{aspect-ratio:4/3;border-radius:18px;background:var(--card);border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;position:relative;width:100%;padding:0;color:var(--mute);max-width:100%}
.photo img,.photo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ov{position:absolute;right:10px;bottom:10px;background:rgba(16,24,40,.6);color:#fff;border-radius:99px;padding:6px 10px;font-size:12.5px;font-weight:700;display:flex;gap:5px;align-items:center}
.photo.wide{aspect-ratio:2/1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vrow{display:grid;grid-template-columns:1fr 1fr 110px 36px;gap:6px;margin-bottom:6px;align-items:center}
.vrow input{padding:11px 10px;font-size:14px}
.vrow button{height:42px;border-radius:12px;border:0;background:var(--redl);color:var(--red);display:grid;place-items:center}
.bn-row .ico.im{width:96px;height:48px;border-radius:12px}
.cnt-dot{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.loader{height:3px;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:90;overflow:hidden;pointer-events:none}
.loader i{display:block;height:100%;width:40%;background:var(--b);border-radius:3px;animation:ld 1s infinite var(--ease)}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .35s}
#splash img{width:96px;height:96px;animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
#splash.hide{opacity:0;pointer-events:none}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
/*__MAPCSS__*/
.locmini{position:relative;height:150px;border-radius:16px;overflow:hidden;margin-bottom:10px;background:#e9edf2}
.locmini .gmap{pointer-events:none}
.locmini .pinw{top:50%}
.locmini .pinb{transform:scale(.8);transform-origin:50% 100%}
.locmini .pbub{display:none}
</style>

<!--__ICONS__-->
<div id="splash"><img src="img/logo.png" alt=""></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="loader" id="loader" hidden><i></i></div>
<main class="app" id="app"></main>
<nav class="tabs" id="nav">
  <button data-tab="dash" class="on"><svg class="ic"><use href="#i-chart"/></svg><span>Asosiy</span></button>
  <button data-tab="orders"><svg class="ic"><use href="#i-orders"/></svg><span>Buyurtmalar</span><i class="bdg num" id="bdg" hidden></i></button>
  <button data-tab="menu"><svg class="ic"><use href="#i-box"/></svg><span>Katalog</span></button>
  <button data-tab="more"><svg class="ic"><use href="#i-widget"/></svg><span>Boshqaruv</span></button>
</nav>
<input type="file" id="fileIn" hidden>

<script>
"use strict";
/*__MAPJS__*/
const DEMO_DATA = /*__DATA__*/null;
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = tg && tg.initData ? tg.initData : "";
const DEMO = !!DEMO_DATA;  // demo faqat demo-yig'ilmada; serverda brauzerdan login bilan kiriladi
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, c = "") => `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const money = n => (Math.round(n) + "").replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
const short = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(".0", "") + " mln" : n >= 1e3 ? Math.round(n / 1e3) + " ming" : String(n);
const hap = k => { try { const h = tg && tg.HapticFeedback; if (!h) return; k === "ok" ? h.notificationOccurred("success") : k === "err" ? h.notificationOccurred("error") : k === "warn" ? h.notificationOccurred("warning") : k === "sel" ? h.selectionChanged() : h.impactOccurred(k || "light"); } catch (e) {} };
let tT; function toast(m, i = "check") { const e = $("#toast"); e.innerHTML = ic(i, "s") + esc(m); e.classList.add("show"); clearTimeout(tT); tT = setTimeout(() => e.classList.remove("show"), 2300); }
const ST = {new: "Yangi", accepted: "Qabul qilindi", on_way: "Yo'lda", done: "Yetkazildi", cancelled: "Bekor qilindi"};
const NEXTL = {accepted: ["Qabul qilish", "check"], on_way: ["Yo'lga chiqdi", "truck"], done: ["Yetkazildi", "flag"], cancelled: ["Bekor qilish", "close"]};
const num = n => (Math.round(n) + "").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const ERR = {bad_login: "Login yoki parol noto'g'ri", too_many: "Ko'p urinish. 10 daqiqadan keyin qayta urinib ko'ring", login_taken: "Bu login band", bad_login_format: "Login: 3–32 ta lotin harf, raqam, _ . -", short_password: "Parol kamida 6 ta belgidan iborat bo'lsin", too_large_20: "Fayl 19 MB dan katta bo'lmasin", login_required: "Qayta kiring", category_not_empty: "Avval bo'limdagi mahsulotlarni o'chiring yoki ko'chiring", bad_price: "Narxni to'g'ri kiriting", name_required: "Nomini kiriting", bad_category: "Bo'limni tanlang", too_fast: "Biroz kuting", forbidden: "Ruxsat yo'q", network: "Internet aloqasi yo'q", bad_type: "Faqat JPG, PNG, WEBP yoki MP4", too_large: "Fayl juda katta (25 MB gacha)", already: "Allaqachon admin", bad_pack: "Qadoqdagi sonini to'g'ri kiriting", bad_amount: "Summani to'g'ri kiriting", bad_zone: "Hudud topilmadi", bad_shop: "Do'kon nomini kiriting", cannot_delete: "Bu yozuvni o'chirib bo'lmaydi", no_chat: "Telegram chat topilmadi — admin botni oching", not_found: "Topilmadi"};
const A = {me: null, view: "dash", stack: [], menu: null, cat: "all", sortMode: false, ordFilter: "active", orders: null, oq: "", activeCount: 0};
const L = o => o ? (o.uz || o.ru || "") : "";
const ago = s => { const d = Date.now() / 1000 - s; if (d < 60) return "hozir"; if (d < 3600) return Math.floor(d / 60) + " daq oldin"; if (d < 86400) return Math.floor(d / 3600) + " soat oldin"; return new Date(s * 1000).toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit"}) + " " + new Date(s * 1000).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); };
const img = (src) => src ? `<img class="fade" src="${esc(src)}" alt="" loading="lazy" onload="this.classList.add('ld')" onerror="this.classList.add('ld')">` : "";

/* ───────── API (demo rejimida — brauzer ichidagi soxta server) ───────── */
let busy = 0; const load = on => { busy += on ? 1 : -1; $("#loader").hidden = busy <= 0; };
async function api(route, body = {}, raw, silent) {
  if (DEMO) return mock(route, body, raw);
  if (!silent) load(true);
  try {
    const H = {"X-Init-Data": INIT, "X-Admin-Token": getTok()};
    const opt = raw ? {method: "POST", headers: Object.assign(H, {"Content-Type": raw.type, "X-Kind": raw.kind || ""}), body: raw.blob}
      : {method: "POST", headers: Object.assign(H, {"Content-Type": "application/json"}), body: JSON.stringify(body)};
    const r = await fetch("api/admin/" + route, opt); const j = await r.json().catch(() => ({ok: false, error: "server_error"}));
    if (!r.ok && j.ok !== false) j.ok = false;
    if (j.error === "login_required" && route !== "me" && route !== "login") { setTok(""); setTimeout(() => location.reload(), 600); }
    return j;
  } catch (e) { return {ok: false, error: "network"}; } finally { if (!silent) load(false); }
}
function getTok() { try { return localStorage.getItem("gx_admin_tok") || ""; } catch (e) { return A.tok || ""; } }
function setTok(v) { A.tok = v; try { v ? localStorage.setItem("gx_admin_tok", v) : localStorage.removeItem("gx_admin_tok"); } catch (e) {} }
const can = p => !!(A.me && (A.me.owner || (A.me.perms || []).includes(p)));
const fail = r => { hap("err"); toast(ERR[r.error] || r.error || "Xatolik", "danger"); };

/* ───────── boot ───────── */
async function boot() {
  if (tg) { try { tg.ready(); tg.expand(); if (tg.isVersionAtLeast("7.7")) tg.disableVerticalSwipes(); if (tg.isVersionAtLeast("6.1")) { tg.setHeaderColor("#f2f4f7"); tg.setBackgroundColor("#f2f4f7"); } tg.BackButton.onClick(back); } catch (e) {} }
  const me = await api("me");
  splashOff();
  if (!me.ok) {
    if (me.error === "login_required") return loginView();
    $("#nav").hidden = true;
    $("#app").innerHTML = `<div class="empty view" style="padding-top:14vh"><div class="ei" style="background:var(--redl);color:var(--red)">${ic("danger", "xl")}</div>
      <b>Aloqa yo'q</b><p>Internetni tekshirib, qayta urinib ko'ring.</p>
      <button class="btn b" style="margin:22px auto 0" onclick="location.reload()">${ic("refresh", "s")} Qayta urinish</button></div>`;
    return;
  }
  A.me = me;
  $$("#nav button").forEach(b => b.hidden = !tabAllowed(b.dataset.tab));
  const h = (location.hash || "").match(/^#order-(\d+)$/);
  go(TABS.find(tabAllowed) || "more", true);
  if (h && can("orders")) { go("orders"); openOrder(+h[1]); }
  if (can("orders")) { pollOrders(); setInterval(pollOrders, 15000); }
}
const tabAllowed = t => t === "more" || (t === "dash" && can("stats")) || (t === "orders" && can("orders")) || (t === "menu" && (can("menu") || can("stock")));
function loginView(err) {
  $("#nav").hidden = true;
  $("#app").innerHTML = `<div class="view" style="padding-top:8vh">
    <img src="img/logo.png" alt="" style="width:72px;height:72px;border-radius:50%;margin-bottom:18px">
    <h1 style="font-size:34px;margin-bottom:6px">Xodimlar paneli</h1><p class="mute" style="margin-bottom:22px">Rahbar bergan login va parol bilan kiring.</p>
    <form id="lf" autocomplete="on">
      <label class="field" style="margin-bottom:10px">${ic("user")}<input id="lu" name="username" autocomplete="username" placeholder="Login" autocapitalize="none" spellcheck="false" required></label>
      <label class="field" style="margin-bottom:6px">${ic("shield")}<input id="lp" name="password" type="password" autocomplete="current-password" placeholder="Parol" required></label>
      <div id="le" class="red" style="min-height:22px;font-weight:700;font-size:14px;margin:4px 2px 8px">${esc(err || "")}</div>
      <button class="btn b full" id="lb" type="submit">Kirish</button>
    </form>
    ${INIT ? `<small style="text-align:center;margin-top:16px">Kirganingizdan keyin buyurtma xabarlari shu Telegram chatga keladi.</small>` : ""}</div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); const b = $("#lb"); b.disabled = true;
    const r = await api("login", {login: $("#lu").value.trim(), password: $("#lp").value}); b.disabled = false;
    if (!r.ok) { hap("err"); $("#le").textContent = ERR[r.error] || "Xatolik"; return; }
    setTok(r.token); hap("ok"); location.reload(); };
}
function splashOff() { setTimeout(() => $("#splash").classList.add("hide"), 150); setTimeout(() => { const s = $("#splash"); s && s.remove(); }, 600); }

/* ───────── navigation ───────── */
const TABS = ["dash", "orders", "menu", "more"];
function go(v, replace) {
  if (TABS.includes(v)) A.stack = []; else if (!replace && A.view !== v) A.stack.push(A.view);
  if (v !== "menu") A.sortMode = false;
  A.view = v; closeModal(true); render(); window.scrollTo(0, 0); updBack();
}
function back() {
  if ($("#mapLayer")) return closeRestMap();
  if ($(".modal")) return closeModal();
  if (A.sortMode) { A.sortMode = false; return render(); }
  if (A.stack.length) { A.view = A.stack.pop(); render(); window.scrollTo(0, 0); return updBack(); }
  if (A.view !== "dash") go("dash");
}
function updBack() { try { (!!$(".modal") || !!$("#mapLayer") || A.stack.length || A.view !== "dash" || A.sortMode) ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
const VIEWS = {dash: vDash, orders: vOrders, menu: vMenu, more: vMore, cats: vCats, banners: vBanners, shops: vShops, debts: vDebts, loadlist: vLoadlist, zones: vZones, broadcast: vBroadcast, settings: vSettings, staff: vStaff};
async function render() {
  const v = A.view;
  $("#nav").hidden = !TABS.includes(v);
  $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === v));
  $("#app").className = "app" + (TABS.includes(v) ? "" : " nonav");
  const html = await VIEWS[v]();
  if (A.view !== v) return;
  $("#app").innerHTML = `<div class="view">${html}</div>`;
  if (VIEWS[v].after) VIEWS[v].after();
}
const titleBar = (title, right = "") => `<div class="top"><div class="grow" style="display:flex;align-items:center;gap:10px">${A.stack.length ? `<button class="ico" style="border:0;background:var(--card);color:var(--ink)" onclick="back()" aria-label="Orqaga">${ic("left")}</button>` : ""}<h1>${title}</h1></div>${right}</div>`;

/* ───────── modal ───────── */
function modal(html) {
  closeModal(true);
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  m.addEventListener("click", e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
  const sh = m.firstElementChild; let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 && !e.target.closest("input,textarea,select") ? e.touches[0].clientY : null; }, {passive: true});
  sh.addEventListener("touchmove", e => { if (y0 == null) return; const d = e.touches[0].clientY - y0; if (d > 0) { sh.style.transition = "none"; sh.style.transform = `translateY(${d}px)`; } }, {passive: true});
  sh.addEventListener("touchend", e => { if (y0 == null) return; const d = e.changedTouches[0].clientY - y0; sh.style.transition = "transform .2s"; sh.style.transform = ""; y0 = null; if (d > 110) closeModal(); });
  updBack(); return m;
}
function closeModal(now) { const m = $(".modal"); if (!m) return; if (now) m.remove(); else { m.classList.add("out"); setTimeout(() => m.remove(), 210); } setTimeout(updBack, 0); }
function confirmBox(title, text, okText, danger) {
  return new Promise(res => {
    modal(`<div class="empty" style="padding:6px 0 14px"><div class="ei" style="${danger ? "background:var(--redl);color:var(--red)" : ""}">${ic(danger ? "trash" : "info", "l")}</div><b>${title}</b><p>${text}</p></div>
      <div class="row"><button class="btn" id="cfN">Bekor qilish</button><button class="btn ${danger ? "red" : "b"}" id="cfY">${okText}</button></div>`);
    $("#cfN").onclick = () => { closeModal(); res(false); }; $("#cfY").onclick = () => { closeModal(); res(true); };
  });
}

/* ───────── DASHBOARD ───────── */
async function vDash() {
  const [d, s] = await Promise.all([api("dashboard", {days: 7}), api("settings")]);
  if (!d.ok) return errBox(d);
  A.settings = s.settings || {};
  const td = d.today, y = d.yesterday, delta = y.revenue ? Math.round((td.revenue - y.revenue) / y.revenue * 100) : null;
  const max = Math.max(1, ...d.by_day.map(x => x.revenue)), wd = ["Ya", "Du", "Se", "Ch", "Pa", "Ju", "Sh"];
  const topMax = Math.max(1, ...d.top.map(x => x.revenue)), pay = d.pay || {}, psum = Math.max(1, (pay.cash || 0) + (pay.debt || 0));
  const acc = A.settings.ACCEPTING !== false;
  return `<div class="top"><div class="grow"><small>Salom, ${esc(A.me.name || "admin")} 👋</small><h1>Bugun</h1></div>${DEMO ? `<span class="pill gold">DEMO</span>` : `<button class="pill" onclick="render()">${ic("refresh", "xs")}</button>`}</div>
    <div class="card" style="margin-bottom:10px"><div class="ico ${acc ? "okb" : "red"}">${ic(acc ? "shop" : "clock")}</div><div class="grow"><b>${acc ? "Buyurtma qabul qilinmoqda" : "Buyurtma qabul yopiq"}</b><small>${acc ? "Do'konlar buyurtma bera oladi" : "Do'konlar katalogni ko'radi, lekin buyurtma bera olmaydi"}</small></div>${can("settings") ? `<button class="sw ${acc ? "on" : ""}" id="accSw" aria-label="Qabul"></button>` : ""}</div>
    <div class="stat"><small>Bugungi buyurtmalar summasi</small><div class="big num">${money(td.revenue)}</div>
      ${delta != null ? `<small style="position:relative;z-index:1;margin-top:2px">${delta >= 0 ? "▲" : "▼"} ${Math.abs(delta)}% kechagiga nisbatan</small>` : ""}
      <div class="sp"><div><small>Buyurtmalar</small><b class="num">${td.orders}</b></div><div><small>O'rtacha</small><b class="num">${short(td.avg)}</b></div></div></div>
    <div class="dtiles"><button class="dtile card tap" style="display:block;margin:0" onclick="if(can('orders')){A.ordFilter='active';go('orders')}"><small>${ic("clock", "xs")} Faol</small><b class="num" style="color:var(--warn)">${d.active}</b></button>
      <button class="dtile card tap" style="display:block;margin:0" onclick="if(can('debts'))go('debts')"><small>${ic("wallet", "xs")} Umumiy qarz</small><b class="num" style="color:var(--red)">${short(d.debt.total)}</b><small>${d.debt.count} ta do'kon</small></button>
      <button class="dtile card tap" style="display:block;margin:0" onclick="if(can('shops'))go('shops')"><small>${ic("shop", "xs")} Do'konlar</small><b class="num">${d.shops}${d.new_shops ? `<span style="font-size:13px;color:#16a34a"> +${d.new_shops}</span>` : ""}</b></button></div>
    ${d.upcoming.length && can("orders") ? `<h2>Yetkazish rejasi</h2>${d.upcoming.map(u => `<button class="card" onclick="A.llDate='${u.date}';go('loadlist')"><div class="ico">${ic("truck")}</div><div class="grow"><b>${esc(u.label)}</b><small class="num">${u.orders} ta buyurtma · ${money(u.sum)}</small></div><span class="pill">${ic("clip", "xs")}Yuklash</span></button>`).join("")}` : ""}
    <h2>Oxirgi 7 kun</h2>
    <div class="bars">${d.by_day.map((x, i) => `<div class="${i === d.by_day.length - 1 ? "today" : ""}"><em class="num">${x.revenue ? short(x.revenue).replace(" ming", "k").replace(" mln", "M") : ""}</em><i style="height:${Math.max(3, x.revenue / max * 100)}%"></i><small>${wd[new Date(x.day * 1000).getDay()]}</small></div>`).join("")}</div>
    <h2>To'lov turi (7 kun)</h2>

function pickFile(accept, cb) { const i = $("#fileIn"); i.accept = accept; i.value = ""; i.onchange = () => { const f = i.files[0]; if (f) cb(f); }; i.click(); }
function resizeImg(file, W, H) {
  return new Promise((res, rej) => { const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => { const r = Math.max(W / im.width, H / im.height), sw = W / r, sh = H / r, c = document.createElement("canvas"); c.width = W; c.height = H;
      const x = c.getContext("2d"); x.fillStyle = "#f4f4f3"; x.fillRect(0, 0, W, H); x.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, 0, 0, W, H); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(), "image/jpeg", .86); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(); }; im.src = u; });
}
async function upload(blob, kind) {
  if (blob.size > 25 * 1024 * 1024) { toast(ERR.too_large, "danger"); return null; }
  toast("Yuklanmoqda…", "upload");
  const r = await api("upload", {}, {blob, type: blob.type || "image/jpeg", kind}); if (!r.ok) { fail(r); return null; }
  toast("Yuklandi"); return r.src;
}

      const days = {}; MK.orders.filter(o => ACT.includes(o.status) && o.delivery_date >= dISO(0)).forEach(o => { days[o.delivery_date] = (days[o.delivery_date] || 0) + 1; });
      return ok({date, label: dLbl(date), totals: tot, products: Object.values(prods), orders: os.map(o => Object.assign(o, {shop: o.ushop, phone: o.uphone})), days: Object.keys(days).sort().map(k => ({date: k, orders: days[k], label: dLbl(k)}))});
    }
    case "menu": return ok(JSON.parse(JSON.stringify(MK.menu)));
    case "product/toggle": { const p = MK.menu.products.find(x => x.id === b.id); p.available = b.available; return ok({}); }
    case "product/delete": MK.menu.products = MK.menu.products.filter(x => x.id !== b.id); return ok({});
    case "product/save": { const p = b.product; if (p.id) { const i = MK.menu.products.findIndex(x => x.id === p.id); MK.menu.products[i] = p; } else { p.id = "p" + Date.now(); const idx = MK.menu.products.map(x => x.cat).lastIndexOf(p.cat); MK.menu.products.splice(idx + 1, 0, p); } return ok({product: p}); }
    case "sort": {
      if (b.kind === "categories") MK.menu.categories = b.ids.map(i => MK.menu.categories.find(c => c.id === i));
      if (b.kind === "banners") MK.menu.banners = b.ids.map(i => MK.menu.banners.find(c => c.id === i));
      if (b.kind === "products") { const pr = MK.menu.products, slots = pr.map((p, k) => b.ids.includes(p.id) ? k : -1).filter(k => k >= 0), m = Object.fromEntries(pr.map(p => [p.id, p])); slots.forEach((s, k) => pr[s] = m[b.ids[k]]); }
      return ok({});
    }
    case "category/save": { if (b.id) MK.menu.categories.find(c => c.id === b.id).name = {uz: b.name.uz || b.name.ru, ru: b.name.ru || b.name.uz}; else { if (!b.name.uz && !b.name.ru) return {ok: false, error: "name_required"}; MK.menu.categories.push({id: "c" + Date.now(), name: {uz: b.name.uz || b.name.ru, ru: b.name.ru || b.name.uz}}); } return ok({}); }
    case "category/delete": if (MK.menu.products.some(p => p.cat === b.id)) return {ok: false, error: "category_not_empty"}; MK.menu.categories = MK.menu.categories.filter(c => c.id !== b.id); return ok({});
    case "upload": return ok({src: URL.createObjectURL(raw.blob)});
    case "banner/save": { const x = b.banner, item = {id: x.id || "b" + Date.now(), src: x.src, type: /^blob:/.test(x.src) ? (bed && bed.type) || "image" : /\.(mp4|mov)$/i.test(x.src) ? "video" : "image"}; if (x.product) item.product = x.product; if (x.category) item.category = x.category; if (x.id) { const i = MK.menu.banners.findIndex(y => y.id === x.id); MK.menu.banners[i] = item; } else MK.menu.banners.unshift(item); return ok({banner: item}); }
    case "banner/delete": MK.menu.banners = MK.menu.banners.filter(x => x.id !== b.id); return ok({});
    case "settings": return ok({settings: Object.assign({}, MK.settings), map_token: ""});
    case "geocode": return ok({uz: "Qashqadaryo viloyati, Shahrisabz, Ipak yo'li ko'chasi", ru: "Кашкадарьинская область, Шахрисабз, улица Ипак йули"});
    case "settings/save": Object.assign(MK.settings, b.settings); return ok({settings: Object.assign({}, MK.settings)});
    case "zones": return ok({zones: MK.zones.map(z => Object.assign({}, z, {shops: MK.users.filter(u => u.zone === z.id).length})), no_zone: MK.users.filter(u => !u.zone).length});
    case "zone/save": { const z = b.zone, cur = MK.zones.find(x => x.id === z.id); if (!z.name.uz && !z.name.ru) return {ok: false, error: "name_required"}; const nz = {id: z.id || "z" + Date.now(), name: {uz: z.name.uz || z.name.ru, ru: z.name.ru || z.name.uz}, days: z.days.sort()}; if (cur) Object.assign(cur, nz); else MK.zones.push(nz); return ok({zone: nz}); }
    case "zone/delete": MK.zones = MK.zones.filter(z => z.id !== b.id); MK.users.forEach(u => { if (u.zone === b.id) u.zone = null; }); return ok({});
    case "shops": case "debts": {
      let l = MK.users.map(shopX);
      if (b.q) { const q = b.q.toLowerCase(); l = l.filter(u => (u.shop + " " + u.name + " " + u.phone).toLowerCase().includes(q)); }
      if (b.zone) l = l.filter(u => b.zone === "-" ? !u.zone : u.zone === b.zone);
      if (route === "debts") l = l.filter(u => u.balance > 0).sort((a, c) => c.balance - a.balance);
      return ok({shops: l, total: l.length, debt: dsum()});
    }
    case "shop": { const u = MK.users.find(x => x.tg_id === b.id); if (!u) return {ok: false, error: "not_found"};
      return ok({shop: shopX(u), ledger: MK.ledger.filter(e => e.tg_id === u.tg_id).slice().reverse(), orders: MK.orders.filter(o => o.tg_id === u.tg_id).slice(-15).reverse().map(o => Object.assign({}, o, {date_label: dLbl(o.delivery_date)}))}); }
    case "shop/save": { const u = MK.users.find(x => x.tg_id === b.id); ["shop", "zone", "debt_limit", "note"].forEach(k => { if (k in b) u[k] = b[k] === "" && k === "zone" ? null : b[k]; }); u.blocked = b.blocked ? 1 : 0; return ok({shop: u}); }
    case "payment": case "adjust": { const amt = route === "payment" ? -Math.abs(b.amount) : b.amount; MK.ledger.push({id: MK.lid++, tg_id: b.id, amount: amt, kind: route, note: b.note, by_name: "Rahbar", created: Date.now() / 1000}); return ok({balance: bal(b.id)}); }
    case "ledger/delete": { const e = MK.ledger.find(x => x.id === b.id); MK.ledger = MK.ledger.filter(x => x.id !== b.id); return ok({balance: e ? bal(e.tg_id) : 0}); }
    case "broadcast": return ok({queued: MK.users.filter(u => !b.zone || u.zone === b.zone).length});
    case "loadlist/send": return ok({});
    case "staff": return ok({staff: MK.staff, owner_ids: [123456789]});
    case "staff/save": { const x = b.staff; if (MK.staff.some(s => s.login === x.login && s.id !== x.id)) return {ok: false, error: "login_taken"};
      if (x.id) Object.assign(MK.staff.find(s => s.id === x.id), {login: x.login, name: x.name, perms: x.perms, active: x.active}); else MK.staff.push({id: Date.now(), login: x.login, name: x.name, perms: x.perms, active: true, telegram: false}); return ok({}); }
    case "staff/delete": MK.staff = MK.staff.filter(s => s.id !== b.id); return ok({});
  }
  return {ok: false, error: "not_found"};
}
boot();
