      <button class="card" onclick="openMap()"><div class="ico">${ic("pin")}</div><div class="grow"><b style="white-space:normal">${esc(S.user.address || t("chooseAddr"))}</b><small>${t("changeOnMap")}</small></div>${ic("right", "chev")}</button>
      <input id="ax" maxlength="120" placeholder="${t("addrExtra")}" value="${esc(S.addrExtra)}" oninput="S.addrExtra=this.value" autocomplete="off">`
    : `<h2>${t("pickupFrom")}</h2><div class="card"><div class="ico">${ic("shop")}</div><div class="grow"><b>${esc(r.name || "Gumbaz Express")}</b><small>${esc(L(r.address))}</small></div></div>`}
    <h2>${t("payment")}</h2>
    <div class="seg" style="margin-bottom:10px"><button data-pay="cash" class="${S.payment === "cash" ? "on" : ""}">${t("cash")}</button><button data-pay="card" class="${S.payment === "card" ? "on" : ""}">${t("card")}</button></div>
    <textarea id="cm" rows="2" maxlength="300" placeholder="${t("comment")}" oninput="S.comment=this.value">${esc(S.comment)}</textarea>
    <h2>${t("items")}</h2>
    <div class="box">${S.cart.map(c => { const x = info(c); return x ? `<div class="line"><span>${esc(L(x.p.name))}${x.v ? " · " + esc(L(x.v.name)) : ""} × ${c.qty}</span><span class="num">${money(x.price * c.qty)}</span></div>` : ""; }).join("")}
      <div class="line"><span>${t("delivery")}</span><span id="dlv">${dl}</span></div></div>
    <div class="foot"><div><div class="srow"><span>${t("total")}</span><b class="num">${money(tot)}</b></div><button class="btn b full" id="po" onclick="placeOrder()">${t("order")}</button></div></div>`;
}
function openExt(u) { try { if (tg && tg.openLink) return tg.openLink(u); } catch (e) {} window.open(u, "_blank"); }
let placing = false, lastOrder = null;
async function placeOrder() {
  if (placing || !S.cart.length) return;
  if (S.delivery !== "pickup" && S.user.lat == null) return openMap();
  placing = true; const b = $("#po"); b.disabled = true; b.innerHTML = `<span class="skel" style="width:110px;height:14px;display:inline-block;background-color:rgba(255,255,255,.4)"></span>`;
  let res;
  const body = {items: S.cart.map(c => ({pid: c.pid, vid: c.vid, qty: c.qty})), delivery: S.delivery, payment: S.payment, lat: S.user.lat, lon: S.user.lon, address: S.user.address, address_extra: S.addrExtra.trim(), comment: S.comment.trim()};
  if (S.demo) {
    await new Promise(r => setTimeout(r, 650));
    const id = store.get("demoSeq", 1040) + 1; store.set("demoSeq", id);
    const o = {id, total: cartTotal(), delivery: S.delivery, status: "new", created: Date.now() / 1000 | 0, items: S.cart.map(c => { const x = info(c); return {pid: c.pid, name: x.p.name, variant: x.v ? x.v.name : null, price: x.price, qty: c.qty}; })};
    const l = store.get("demoOrders", []); l.unshift(o); store.set("demoOrders", l.slice(0, 30));
    res = {ok: true, order: o};
  } else res = await api("order", body);
  placing = false;
  if (!res.ok) {
    hap("err"); b.disabled = false; b.textContent = t("order");
    const M = {too_fast: t("tooFast"), item_unavailable: t("unavailable"), min_order: t("minOrder") + ": " + money(S.set.min_order || 0), no_address: t("chooseAddr"), closed: t("closedTitle")};
    toast(M[res.error] || t("err"), "danger"); if (res.error === "item_unavailable" || res.error === "closed") reloadMenu(); return;
  }
  hap("ok"); lastOrder = res; S.cart = []; saveCart(); S.comment = ""; S.addrExtra = ""; S.orders = null;
  go("success", true); S.stack = [];
}
function vSuccess() {
  const o = lastOrder || {order: {id: "—", delivery: "courier"}}, d = o.order.delivery;
  return `<div class="okc-ring">${ic("check", "xl")}</div><h1 style="text-align:center">${t("thanks")}</h1>
    <small style="text-align:center;margin:14px 0 6px">${t("orderNo")}</small><div class="codebox num">#${o.order.id}</div>
    <div class="banner info" style="margin-top:10px">${ic("info")}<div>${t(d === "yandex" ? "yandexNote" : d === "courier" ? "courierNote" : "pickupNote")}</div></div>
    <div class="foot"><div style="display:flex;flex-direction:column;gap:8px">
    <div class="row"><button class="btn" onclick="go('orders')">${ic("orders", "s")} ${t("myOrders")}</button><button class="btn soft" onclick="go('home')">${ic("home", "s")} ${t("menu")}</button></div></div></div>`;
}
async function reloadMenu() { if (S.demo) return; const m = await api("menu"); if (m.products) { const sig = JSON.stringify([m.products, m.banners, m.categories, m.settings]); if (sig === S.sig) return; S.sig = sig; applyMenu(m); S.cart = S.cart.filter(c => { const x = info(c); return x && x.p.available !== false; }); saveCart(); render(); } }

/* ───────── orders ───────── */
function vOrders() { return `<div class="top"><h1>${t("myOrders")}</h1><button class="pill" onclick="hap();loadOrders()">${ic("refresh", "xs")}</button></div><div id="ol">${S.orders ? ordersHTML() : [1, 2, 3].map(() => `<div class="card"><div class="skel" style="width:44px;height:44px;border-radius:13px"></div><div class="grow"><div class="skel" style="height:14px;width:50%"></div><div class="skel" style="height:11px;width:80%;margin-top:8px"></div></div></div>`).join("")}</div>`; }
async function loadOrders(silent) {
  let l; if (S.demo) l = store.get("demoOrders", []); else { const r = await api("orders", {}); if (!r.ok) { if (!silent) toast(t("err"), "danger"); return; } l = r.orders; }
  S.orders = l; const ol = $("#ol"); if (ol && S.view === "orders") ol.innerHTML = ordersHTML(); if (S.view === "profile") { const s = $("#pstat"); if (s) s.innerHTML = pstat(); }
}
function ordersHTML() {
  if (!S.orders.length) return `<div class="empty rise"><div class="ei">${ic("orders", "xl")}</div><b>${t("noOrders")}</b><p>${t("noOrdersText")}</p><button class="btn b" style="margin:22px auto 0" onclick="go('home')">${t("toMenu")}</button></div>`;
  const dt = s => { const d = new Date(s * 1000); return d.toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit"}) + " · " + d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); };
  return S.orders.map((o, i) => `<div class="card rise" style="animation-delay:${Math.min(i, 8) * 30}ms;align-items:flex-start"><div class="ico">${ic(o.delivery === "pickup" ? "shop" : o.delivery === "yandex" ? "delivery" : "scooter")}</div>
    <div class="grow"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b class="num">#${o.id}</b><span class="tag ${o.status}">${t("status")[o.status] || o.status}</span></div>
    <small style="white-space:normal;margin-top:3px">${o.items.map(x => esc(L(x.name)) + (x.variant ? " (" + esc(L(x.variant)) + ")" : "") + " × " + x.qty).join(", ")}</small>
    <div style="display:flex;justify-content:space-between;margin-top:8px"><small class="num">${dt(o.created)}</small><b class="num" style="font-weight:800">${money(o.total)}</b></div></div></div>`).join("");
}

/* ───────── profile ───────── */
function pstat() { const l = (S.orders || []).filter(o => o.status !== "cancelled"); return `<div><small>${t("ordersCnt")}</small><b class="num">${S.orders ? l.length : "…"}</b></div><div><small>${t("spent")}</small><b class="num">${S.orders ? money(l.reduce((a, o) => a + o.total, 0)) : "…"}</b></div>`; }
function vProfile() {
  const u = S.user;
  return `<div class="top"><h1>${t("profile")}</h1>${S.demo ? `<span class="pill gold">${t("demo")}</span>` : ""}</div>
    <div class="stat"><div style="display:flex;gap:14px;align-items:center;position:relative;z-index:1">
      <button class="ph-av" onclick="$('#avFile').click()" aria-label="Rasm">${avatar(u)}<span class="cam">${ic("camera", "xs")}</span></button>
      <div style="min-width:0"><b style="font-size:20px;font-weight:800;display:block">${esc(u.name || "—")}</b><small class="num">${esc(u.phone || "")}</small></div></div>
      <div class="sp" id="pstat">${pstat()}</div></div>
    <h2>${t("account")}</h2>
    <button class="card" onclick="editName()"><div class="ico">${ic("user")}</div><div class="grow"><small>${t("name")}</small><b>${esc(u.name || "—")}</b></div>${ic("pen", "chev")}</button>
    <button class="card" onclick="openMap()"><div class="ico">${ic("pin")}</div><div class="grow"><small>${t("address")}</small><b>${esc(u.address || t("chooseAddr"))}</b></div>${ic("right", "chev")}</button>
    <div class="card"><div class="ico">${ic("globe")}</div><div class="grow"><b>${t("language")}</b></div><div class="seg lseg"><button data-lang="uz" class="${S.lang === "uz" ? "on" : ""}">UZ</button><button data-lang="ru" class="${S.lang === "ru" ? "on" : ""}">RU</button></div></div>
    <h2>${t("help")}</h2>
    <button class="card" onclick="support()"><div class="ico">${ic("phone")}</div><div class="grow"><b>${t("support")}</b><small class="num">${esc(S.set.support_phone || "")}</small></div>${ic("right", "chev")}</button>
    ${S.set.support_username ? `<button class="card" onclick="tgSupport()"><div class="ico">${ic("chat")}</div><div class="grow"><b>${t("writeUs")}</b><small>@${esc(S.set.support_username)}</small></div>${ic("right", "chev")}</button>` : ""}
    <button class="card" onclick="go('terms')"><div class="ico">${ic("doc")}</div><div class="grow"><b>${t("terms")}</b></div>${ic("right", "chev")}</button>
    <div class="card"><div class="ico">${ic("clock")}</div><div class="grow"><b>${t("hours")}</b><small>${esc(S.set.work_hours || "24/7")}</small></div></div>
    <button class="card" onclick="askLogout()" style="margin-top:12px"><div class="ico red">${ic("logout")}</div><div class="grow"><b class="red">${t("logout")}</b></div></button>
    <small style="text-align:center;margin-top:16px">Gumbaz Express · v2.0</small>`;
}
function vTerms() { return `<div class="top"><h1>${t("terms")}</h1></div><div class="box terms">${TERMS[S.lang]}</div>`; }
async function saveProfile(f) { if (S.demo) { Object.assign(S.user, f); store.set("demoUser", S.user); return true; } const r = await api("profile", f); if (r.ok) { S.user = r.user; return true; } toast(t("err"), "danger"); return false; }
function editName() {
  modal(`<h3 style="margin-bottom:12px">${t("editName")}</h3><input id="ni" maxlength="60" value="${esc(S.user.name || "")}" autocomplete="name"><button class="btn b full" id="ns" style="margin-top:12px">${t("save")}</button>`);
  const i = $("#ni"); setTimeout(() => i.focus(), 280);
  const save = async () => { const v = i.value.trim(); if (!v) return i.focus(); if (await saveProfile({name: v})) { closeModal(); render(); toast(t("saved")); hap("ok"); } };
  $("#ns").onclick = save; i.onkeydown = e => { if (e.key === "Enter") save(); };
}
async function setLang(l) { if (l === S.lang) return; S.lang = l; store.set("lang", l); hap("sel"); i18nStatic(); render(); saveProfile({lang: l}); }
function support() {
  const ph = S.set.support_phone || "";
  modal(`<div class="empty" style="padding:6px 0 10px"><div class="ei">${ic("phone", "l")}</div><b>${t("support")}</b><div class="codebox num" style="font-size:24px;margin-top:12px">${esc(ph)}</div></div>
    <a class="btn b full" href="tel:${esc(ph.replace(/[^\d+]/g, ""))}">${ic("phone", "s")} ${t("call")}</a><button class="btn full" id="cp" style="margin-top:8px">${t("copy")}</button>`);
  $("#cp").onclick = () => { const ok = () => { toast(t("copied")); closeModal(); }; navigator.clipboard ? navigator.clipboard.writeText(ph).then(ok, ok) : ok(); };
}
function tgSupport() { const u = "https://t.me/" + S.set.support_username; try { tg.openTelegramLink(u); } catch (e) { openExt(u); } }
function askLogout() {
  modal(`<div class="empty" style="padding:6px 0 14px"><div class="ei" style="background:var(--redl);color:var(--red)">${ic("logout", "l")}</div><b>${t("logoutQ")}</b><p>${t("logoutText")}</p></div>
    <div class="row"><button class="btn" onclick="closeModal()">${t("cancel")}</button><button class="btn red" id="ly">${t("yes")}</button></div>`);
  $("#ly").onclick = async () => { store.del("cart_" + (S.user.tg_id || 0)); if (S.demo) { store.del("demoUser"); store.del("demoOrders"); return location.reload(); } await api("logout", {}); hap("ok"); try { tg.close(); } catch (e) { location.reload(); } };
}
$("#avFile").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (!f || !/^image\//.test(f.type)) return;
  const im = new Image(), url = URL.createObjectURL(f);
  im.onload = async () => { const s = Math.min(im.width, im.height), c = document.createElement("canvas"); c.width = c.height = 400; c.getContext("2d").drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 400, 400); URL.revokeObjectURL(url);
    const data = c.toDataURL("image/jpeg", .86);
    if (S.demo) { S.user.photo = data; store.set("demoUser", S.user); } else { const r = await api("avatar", {image: data}); if (!r.ok) return toast(t("err"), "danger"); S.user = r.user; }
    render(); toast(t("photoSaved")); hap("ok"); };
  im.onerror = () => toast(t("err"), "danger"); im.src = url; };

/* ───────── map ───────── */
let map = null, mpos = null, maddr = "", gT, gR = 0;
function openMap() {
  const r = S.set.restaurant || {lat: 39.0578, lon: 66.8342}, st = S.user.lat != null ? [S.user.lat, S.user.lon] : [r.lat, r.lon];
  mpos = {lat: st[0], lon: st[1]}; maddr = S.user.address || "";
  const el = document.createElement("div"); el.id = "mapLayer";
  el.innerHTML = `<div id="map"></div><div class="mapfb" id="mfb" hidden><p>${t("mapOffline")}</p></div><div class="pin" id="pin">${ic("pin")}</div>
    <div class="mtop"><button class="rbtn" onclick="closeMap()" aria-label="Back">${ic("left")}</button></div>
    <button class="rbtn mgps" onclick="locate()" aria-label="GPS">${ic("gps")}</button>
    <div class="mcard"><div><div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;min-height:42px"><div class="ico" style="width:40px;height:40px">${ic("pin", "s")}</div><div style="min-width:0"><b id="ma" style="font-weight:800">${esc(maddr || t("locating"))}</b><small>${t("moveMap")}</small></div></div>
    <button class="btn b full" id="msave">${t("confirmAddr")}</button></div></div>`;
  document.body.appendChild(el); $("#msave").onclick = saveAddr; updBack();
  if (!window.L) { $("#mfb").hidden = false; return; }
  map = L.map("map", {zoomControl: false, attributionControl: false}).setView(st, 16);
  const tl = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {subdomains: "abcd", maxZoom: 19, detectRetina: true});
  let ok = false, errs = 0; tl.on("tileload", () => { ok = true; $("#mfb") && ($("#mfb").hidden = true); }); tl.on("tileerror", () => { if (!ok && ++errs > 3 && $("#mfb")) $("#mfb").hidden = false; });
  tl.addTo(map);
  map.on("movestart", () => $("#pin").classList.add("up"));
  map.on("moveend", () => { $("#pin").classList.remove("up"); const c = map.getCenter(); mpos = {lat: c.lat, lon: c.lng}; geo(); });
  if (S.user.lat == null) locate();
}
function closeMap() { const m = $("#mapLayer"); if (map) { map.remove(); map = null; } if (m) m.remove(); updBack(); }
function geo() {
  clearTimeout(gT); $("#ma").textContent = t("locating"); $("#msave").disabled = true;
  gT = setTimeout(async () => { const my = ++gR, p = mpos; let a = "";
    if (!S.demo) { const r = await api("geocode", {lat: p.lat, lon: p.lon, lang: S.lang}); if (r.ok) a = r.address; }
    if (my !== gR || !$("#ma")) return; maddr = a || `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`; $("#ma").textContent = maddr; $("#msave").disabled = false; }, 450);
}
function locate() {
  hap(); const goTo = (a, b) => { if (map) map.setView([a, b], 17); else { mpos = {lat: a, lon: b}; geo(); } };
  const br = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => goTo(p.coords.latitude, p.coords.longitude), () => toast(t("err"), "danger"), {enableHighAccuracy: true, timeout: 10000}) : toast(t("err"), "danger");
  const lm = tg && tg.LocationManager;
  if (lm && tg.isVersionAtLeast("8.0")) lm.init(() => { if (!lm.isLocationAvailable) return br(); lm.getLocation(d => { if (d) goTo(d.latitude, d.longitude); else if (lm.isAccessRequested && !lm.isAccessGranted) lm.openSettings(); else br(); }); });
  else br();
}
async function saveAddr() {
  if (!mpos) return; const b = $("#msave"); b.disabled = true;
  if (S.demo) { Object.assign(S.user, {lat: mpos.lat, lon: mpos.lon, address: maddr}); store.set("demoUser", S.user); }
  else { const r = await api("address", {lat: mpos.lat, lon: mpos.lon, address: maddr}); if (!r.ok) { b.disabled = false; return toast(t("err"), "danger"); } S.user = r.user; }
  hap("ok"); toast(t("saved")); closeMap(); render();
}

/* ───────── events ───────── */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-inc],[data-dec],[data-quick],[data-q],[data-p],[data-cat],[data-tab],[data-deliv],[data-pay],[data-lang]"); if (!el) return;
  const d = el.dataset;
  if (d.inc) { e.stopPropagation(); return addCart(d.inc, null, 1); }
  if (d.dec) { e.stopPropagation(); return chQty(key(d.dec, null), -1); }
  if (d.quick) { e.stopPropagation(); const p = P(d.quick); return p.variants ? openProduct(p.id) : addCart(p.id, null, 1); }
  if (d.q) return chQty(d.q, +d.d);
  if (d.p) { if (e.target.closest("[data-stop]")) return; return openProduct(d.p); }
  if (d.cat && el.classList.contains("chip")) { hap("sel"); return toCat(d.cat); }
  if (d.tab) { hap("sel"); if (d.tab === S.view && d.tab === "home") return window.scrollTo({top: 0, behavior: "smooth"}); return go(d.tab); }
  if (d.deliv) { S.delivery = d.deliv; hap("sel"); render(); return; }
  if (d.pay) { S.payment = d.pay; hap("sel"); $$("[data-pay]").forEach(b => b.classList.toggle("on", b === el)); return; }
  if (d.lang) return setLang(d.lang);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".pc[data-p]")) { e.preventDefault(); openProduct(e.target.dataset.p); } if (e.key === "Escape") back(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) return; if (S.view === "orders") loadOrders(true); if (!S.demo && S.view === "home") reloadMenu(); });
boot().catch(err => { console.error(err); if (FALLBACK) { applyMenu(FALLBACK); S.demo = true; S.user = {tg_id: 0, name: "Mehmon"}; i18nStatic(); go("home", true); } splashOff(); });
</script>
