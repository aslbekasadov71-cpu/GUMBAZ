<style>
/*__BASE__*/
/* ── do'konchi ilovasi ── */
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app.withcart{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.app.nonav{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.hi{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.hi .logo{width:46px;height:46px;border-radius:50%;flex:none}
.hi .who{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.hi .who small{display:flex;align-items:center;gap:4px}
.hi .who b{display:flex;align-items:center;gap:2px;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden}
.hi .who b span{overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;background:var(--bl);color:var(--b);display:grid;place-items:center;font-weight:800;font-size:17px;overflow:hidden;flex:none;border:0;padding:0}
.av img{width:100%;height:100%;object-fit:cover}
.qinfo{display:flex;gap:8px;margin-bottom:12px}
.qinfo button{flex:1;min-width:0;border:0;border-radius:16px;padding:10px 12px;text-align:left;background:var(--card);display:flex;gap:10px;align-items:center}
.qinfo .ico{width:36px;height:36px;border-radius:11px}
.qinfo b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.qinfo small{font-size:12px}
.qinfo .debt b{color:var(--red)}
.closed{margin-bottom:12px}
/* banners */
.bwrap{margin:12px -14px 0}
.btrack{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 14px;scroll-padding:0 14px}
.btrack::-webkit-scrollbar{display:none}
.bs{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:2/1;border-radius:22px;overflow:hidden;background:var(--bd);position:relative;border:0;padding:0;max-width:100%}
.bs img,.bs video{width:100%;height:100%;object-fit:cover;display:block}
.bs .vt{position:absolute;left:10px;top:10px;background:rgba(16,24,40,.45);color:#fff;border-radius:99px;padding:3px 9px 3px 5px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px;backdrop-filter:blur(6px)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:6px;background:#d0d5dd;transition:width .3s var(--ease),background .3s}
.dots i.on{width:20px;background:var(--b)}
.catbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:6px -14px 0;padding:10px 14px}
.catbar.stuck{box-shadow:0 8px 16px -12px rgba(16,24,40,.25)}
.sec{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.sec h3{margin:16px 2px 10px;display:flex;align-items:center;gap:8px}
.sec h3 .n{font-size:13px;color:var(--mute);font-weight:700}
/* product rows */
.pr{background:var(--card);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:8px;position:relative;cursor:pointer;transition:transform .12s var(--ease)}
.pr:active{transform:scale(.99)}
.pr .pi{width:76px;height:76px;border-radius:14px;flex:none;position:relative;overflow:hidden;background:var(--photo)}
.pr .pi img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{position:absolute;inset:0;display:grid;place-items:center;background:hsl(var(--h,215) 80% 95%);color:hsl(var(--h,215) 65% 45%)}
.noimg b{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.noimg.big .ic{width:64px;height:64px}.noimg.big b{font-size:13px;bottom:12px}
.pr .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pr .nm{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr .pk{font-size:12.5px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:4px}
.pr .pp{font-size:16px;font-weight:800;white-space:nowrap;margin-top:2px}
.pr .pp small{display:inline;font-size:12px;font-weight:600}
.pr .ctl{flex:none;align-self:flex-end;display:flex;flex-direction:column;align-items:center;gap:3px}
.addb{width:40px;height:40px;border-radius:13px;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none;border:0;padding:0;transition:transform .15s var(--ease),background .15s}
.addb:active{transform:scale(.88)}
.vq{display:flex;flex-direction:column;align-items:center;background:var(--bl);border-radius:13px;padding:3px}
.vq button{border:0;background:none;color:var(--b);width:34px;height:28px;display:grid;place-items:center;border-radius:9px}
.vq button:active{background:#d5e2fb}
.vq b{font-size:15px;font-weight:800;color:var(--b);min-width:30px;text-align:center;line-height:1.1}
.vq small{font-size:10px;font-weight:700;color:var(--b);opacity:.8;line-height:1}
.badge{position:absolute;left:5px;top:5px;z-index:1;font-size:10.5px;font-weight:800;padding:2px 7px 2px 5px;border-radius:99px;display:flex;align-items:center;gap:2px;background:var(--gl);color:var(--gd)}
.badge.new{background:var(--okl);color:#079455}.badge.sale{background:var(--redl);color:var(--red)}
.pr.off{opacity:.55}.pr.off .ctl{display:none}
.pr .soldout{font-size:12px;font-weight:800;color:var(--red)}
/* cart slab */
.slab{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 max(14px,env(safe-area-inset-left,0px));pointer-events:none;animation:rise .3s var(--ease)}
.slab>div{max-width:532px;margin:0 auto;background:var(--card);border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(16,24,40,.14);pointer-events:auto}
.slab small{font-size:12.5px}
.slab b{font-size:20px;font-weight:800;display:block;letter-spacing:-.01em}
.slab .btn{flex:none;padding:13px 18px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(16,24,40,.08);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot>div{max-width:528px;margin:0 auto}
.srow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:15px;color:var(--mute);font-weight:600}
.srow b{font-size:22px;font-weight:800;color:var(--ink)}
/* product sheet */
.pimg{aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--photo);margin-bottom:14px;max-width:100%;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.sheet h1{margin-bottom:6px;font-size:23px}
.sheet .desc{color:var(--mute);margin-bottom:12px;font-size:14px}
.useg button b{font-size:14.5px}
.qbig{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:8px;margin-top:10px}
.qbig button.st{width:48px;height:48px;border-radius:13px;border:0;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none}
.qbig input{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:800;border:0;padding:6px;background:none}
.qchips{display:flex;gap:6px;margin-top:8px}
.qchips button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 0;font-weight:800;font-size:14px;color:var(--b)}
.qsum{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 10px;color:var(--mute);font-weight:600;font-size:14px}
.qsum b{color:var(--ink);font-size:20px;font-weight:800}
/* cart items */
.ci{align-items:center}
.ci .ico.im{width:58px;height:58px;border-radius:12px}
.ci .grow b{white-space:normal;line-height:1.25;font-size:14.5px}
.ci .pp{font-weight:800;font-size:15px;margin-top:3px;display:block;color:var(--ink)}
.qty input{width:52px;border:0;background:none;text-align:center;font-weight:800;font-size:16px;padding:4px 0}
/* checkout */
.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dates button{border:2px solid transparent;background:var(--card);border-radius:16px;padding:12px;text-align:left;transition:border-color .18s}
.dates button.on{border-color:var(--b);background:var(--bl)}
.dates b{display:block;font-weight:800;font-size:15px}
.dates small{font-size:12.5px}
.opt{border:2px solid transparent;transition:border-color .18s}
.opt.on{border-color:var(--b)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #d0d5dd;flex:none;display:grid;place-items:center;transition:border-color .18s}
.opt.on .radio{border-color:var(--b)}
.opt.on .radio::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--b)}
.okc-ring{width:96px;height:96px;border-radius:50%;background:var(--okl);color:#079455;display:grid;place-items:center;margin:30px auto 18px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* profile / ledger */
.ph-av{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;font-weight:800;overflow:hidden;flex:none;position:relative;border:0;color:#fff;padding:0}
.ph-av img{width:100%;height:100%;object-fit:cover}
.stat.red{background:linear-gradient(135deg,#7a1a12 0%,#d92d20 100%)}
.stat.ok{background:linear-gradient(135deg,#05603a 0%,#12b76a 100%)}
.lseg{width:116px;flex:none;padding:3px}
.lseg button{padding:7px 4px}
.le .amt{font-weight:800;white-space:nowrap}
.le .amt.plus{color:var(--red)}.le .amt.minus{color:#079455}
.terms p{margin:0 0 10px;line-height:1.55;max-width:65ch}
.terms h3{font-size:16px;margin:18px 0 6px}
.zl button{margin-bottom:8px}
/*__MAPCSS__*/
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .35s}
#splash img{width:112px;height:112px;animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
#splash.hide{opacity:0;pointer-events:none}
</style>

async function loadLedger() {
  let r; if (S.demo) r = {ok: true, balance: S.acc.balance, entries: store.get("demoLedger", [{id: 2, amount: -150000, kind: "payment", note: "Naqd", created: Date.now() / 1000 - 86400 * 2}, {id: 1, amount: 500000, kind: "order", order_id: 1037, note: "Buyurtma #1037", created: Date.now() / 1000 - 86400 * 6}])};
  else r = await api("ledger", {});

function ledgerHTML(es) {
  if (!es.length) return `<div class="empty"><div class="ei">${ic("notebook", "xl")}</div><b>${t("ledgerEmpty")}</b></div>`;
  const dt = s => { const d = new Date(s * 1000); return d.toLocaleDateString("ru-RU", {day: "2-digit", month: "2-digit", year: "2-digit"}) + " · " + d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); };
  return es.map((e, i) => `<div class="card le rise" style="animation-delay:${Math.min(i, 10) * 20}ms"><div class="ico ${e.amount > 0 ? "red" : "okb"}">${ic(e.kind === "payment" ? "handmoney" : e.kind === "order" ? "box" : "pen")}</div>
    <div class="grow"><b>${t(e.kind === "payment" ? "kPayment" : e.kind === "order" ? "kOrder" : "kAdjust")}</b><small>${esc(e.note || "")}${e.note ? " · " : ""}${dt(e.created)}</small></div>
    <span class="amt num ${e.amount > 0 ? "plus" : "minus"}">${e.amount > 0 ? "+" : "−"}${num(Math.abs(e.amount))}</span></div>`).join("");
}

/*__MAPJS__*/
let MP = null;
function openMap() {
  if ($("#mapLayer")) return;
  const b = S.set.base || {lat: 39.0578, lon: 66.8342}, u = S.user, has = u.lat != null;
  const street0 = /^-?\d+\.\d+,\s*-?\d+\.\d+$/.test(u.address || "") ? "" : (u.address || "");
  MP = {lat: has ? u.lat : b.lat, lon: has ? u.lon : b.lon, sug: street0, req: 0, gT: 0, map: null};
  const el = document.createElement("div"); el.id = "mapLayer";
  el.innerHTML = `<div class="gmap" id="gmap"></div><div class="mshade"></div>
    <div class="mapfb" id="mfb" hidden>${ic("info", "s")}<span>${t("mapOffline")}</span></div>
    <div class="pinw" id="pin"><i class="pshadow"></i><i class="pring"></i><div class="pinb">${PIN_SVG}</div><div class="pbub">${t("hereShop")}</div></div>
    <div class="mtop"><button class="rbtn" onclick="closeMap()" aria-label="${t("cancel")}">${ic("left")}</button><div class="mtitle">${S.set.map_token || S.set.ymaps_key ? "" : t("mapTitle")}</div>
      ${S.set.map_token || S.set.ymaps_key ? `<div class="mstyle" id="mstyle"><button data-ms="sat">${t("satL")}</button><button data-ms="map">${t("schemeL")}</button></div>` : `<span class="ph"></span>`}</div>
    <div class="mctl" id="mctl"><div class="mzoom"><button id="zin" aria-label="+">${ic("plus")}</button><button id="zout" aria-label="−">${ic("minus")}</button></div>
      <button class="rbtn gps" id="mgps" aria-label="GPS">${ic("gps")}</button></div>
    <div class="mattr" id="mattr">© OpenStreetMap</div>
    <div class="msheet" id="msheet"><div><div class="grab"></div>
      <div class="mhead"><h3>${t("mapTitle")}</h3></div>
      <label class="mstreet" id="mst"><span class="ico">${ic("pin", "s")}</span><input id="ma" maxlength="200" placeholder="${t("streetPh")}" value="${esc(street0)}" autocomplete="street-address" enterkeyhint="next"></label>
      <input class="mland" id="m_land" maxlength="120" placeholder="${t("landPh")}" value="${esc(u.landmark || "")}">
      <button class="btn b full" id="msave">${ic("check", "s")} ${t("saveAddr")}</button></div></div>`;
  document.body.appendChild(el); updBack();
  const sheet = $("#msheet"), pin = $("#pin"), ctl = $("#mctl"), attr = $("#mattr");
  const mbx = S.set.map_token, yk = S.set.ymaps_key, st = mapStyle();
  if (yk) el.classList.toggle("sat", st === "sat");
  else if (mbx) { $("#gmap").classList.add("mbx"); $("#mattr").textContent = "© Mapbox · © OpenStreetMap · © Maxar"; el.classList.toggle("sat", st === "sat"); }
  const map = MP.map = makeMap($("#gmap"), {lat: MP.lat, lon: MP.lon, zoom: has ? 18 : 15, tileUrl: tileFn(mbx, st), ykey: yk, ystyle: st,
    focusY: H => Math.max(150, (H - sheet.offsetHeight) / 2 + 40),
    onMeasure: m => { pin.style.top = m.fy + "px"; const bb = sheet.offsetHeight + 14; ctl.style.bottom = bb + "px"; attr.style.bottom = (bb - 4) + "px"; },
    onMoveStart: () => { el.classList.add("moving"); pin.classList.remove("drop"); pin.classList.add("lift"); hap("sel"); },
    onMoveEnd: () => { el.classList.remove("moving"); pin.classList.remove("lift"); void pin.offsetWidth; pin.classList.add("drop"); hap("light"); onPin(); },
    onTileFail: () => { $("#mfb") && ($("#mfb").hidden = false); }, onTileOk: () => { $("#mfb") && ($("#mfb").hidden = true); }});
  const rm = document.createElement("div"); rm.className = "rmk"; rm.innerHTML = `<i></i><div><img src="img/logo.png" alt=""></div><b>${t("base")}</b>`;
  map.addMarker(b.lat, b.lon, rm);
  $("#zin").onclick = () => { hap("sel"); map.zoomTo(Math.round(map.z) + 1); };
  $("#zout").onclick = () => { hap("sel"); map.zoomTo(Math.round(map.z) - 1); };
  $("#mgps").onclick = locate;
  $$("#mstyle button").forEach(bt => { bt.classList.toggle("on", bt.dataset.ms === st);
    bt.onclick = () => { const v = mapStyle(bt.dataset.ms); hap("sel"); $$("#mstyle button").forEach(x => x.classList.toggle("on", x === bt)); el.classList.toggle("sat", v === "sat"); if (map.yandex) map.setType(v); else map.setTiles(tileFn(mbx, v)); }; });
  $("#msave").onclick = saveAddr;
  $("#ma").addEventListener("input", () => $("#mst").classList.remove("bad"));
  $("#ma").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#m_land").focus(); } });
  $("#m_land").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
  setTimeout(() => { pin.classList.add("drop"); onPin(true); }, 60);
  if (!has) locate();
}
function closeMap() { const m = $("#mapLayer"); if (MP) clearTimeout(MP.gT); if (MP && MP.map) MP.map.destroy(); MP = null; if (m) { m.style.transition = "opacity .2s"; m.style.opacity = "0"; setTimeout(() => m.remove(), 200); } setTimeout(updBack, 0); }
function onPin(initial) {
  if (!MP) return; const map = MP.map; MP.lat = map.lat; MP.lon = map.lon;
  if (initial && $("#ma").value.trim()) return;
  const inp = $("#ma"), cur = inp.value.trim(), canFill = !cur || cur === MP.sug;
  clearTimeout(MP.gT); if (canFill) inp.classList.add("loading");
  MP.gT = setTimeout(async () => {
    if (!MP) return;
    const my = ++MP.req; let a = "";
    if (!S.demo) { const res = await api("geocode", {lat: MP.lat, lon: MP.lon, lang: S.lang}); if (res.ok) a = res.address; }
    if (!MP || my !== MP.req) return;
    inp.classList.remove("loading");
    if (a && !/^-?\d+\.\d+,/.test(a)) { const now = inp.value.trim(); if (!now || now === MP.sug) inp.value = a; MP.sug = a; }
  }, 420);
}
function locate() {
  hap(); const b = $("#mgps"); b && b.classList.add("busy");
  const done = () => b && b.classList.remove("busy");
  const goTo = (a, c) => { done(); if (!MP) return; MP.map.flyTo(a, c, 17, 900);
    if (!MP.udot) { const d = document.createElement("div"); d.className = "udot"; d.innerHTML = "<i></i><span></span>"; MP.udot = MP.map.addMarker(a, c, d); } else { MP.udot.lat = a; MP.udot.lon = c; } };
  const fail = () => { done(); toast(t("gpsErr"), "danger"); };
  const br = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => goTo(p.coords.latitude, p.coords.longitude), fail, {enableHighAccuracy: true, timeout: 12000, maximumAge: 30000}) : fail();
  const lm = tg && tg.LocationManager;
  if (lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) lm.init(() => { if (!lm.isLocationAvailable) return br(); lm.getLocation(d => { if (d) goTo(d.latitude, d.longitude); else if (lm.isAccessRequested && !lm.isAccessGranted) { done(); lm.openSettings(); } else br(); }); });
  else br();
}
async function saveAddr() {
  if (!MP) return;
  const street = $("#ma").value.trim();
  if (street.length < 3) { const st = $("#mst"); st.classList.remove("bad"); void st.offsetWidth; st.classList.add("bad"); hap("err"); toast(t("streetNeed"), "danger"); return $("#ma").focus(); }
  const body = {lat: MP.map.lat, lon: MP.map.lon, address: street, landmark: $("#m_land").value.trim()};
  const b = $("#msave"); b.disabled = true;
  if (S.demo) { Object.assign(S.user, body); store.set("demoUser", S.user); }
  else { const r = await api("address", body); if (!r.ok) { b.disabled = false; hap("err"); return toast(t("err"), "danger"); } S.user = r.user; if (r.account) S.acc = r.account; }
  if (S.demo) await refreshAcc();
  const ds = (S.acc.dates || []).map(d => d.date); if (!ds.includes(S.date)) S.date = ds[0] || null;
  hap("ok"); toast(t("saved")); closeMap(); render();
}

/* ───────── events ───────── */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-inc],[data-dec],[data-quick],[data-q],[data-p],[data-cat],[data-tab],[data-pay],[data-lang],[data-date],[data-reo],[data-oi]"); if (!el) return;
  const d = el.dataset;
  if (d.inc) { e.stopPropagation(); const p = P(d.inc); return bump(p.id, defUnit(p), 1); }
  if (d.dec) { e.stopPropagation(); const p = P(d.dec); return bump(p.id, defUnit(p), -1); }
  if (d.quick) { e.stopPropagation(); const p = P(d.quick); if (S.cart.some(c => c.pid === p.id) || sellUnits(p).length > 1) return openProduct(p.id); return bump(p.id, defUnit(p), 1); }
  if (d.q) { const [pid, u] = d.q.split("|"); return bump(pid, u, +d.d); }
  if (d.reo) { e.stopPropagation(); return reorder(+d.reo); }
  if (d.oi) return openOrder(+d.oi);
  if (d.p) { if (e.target.closest("[data-stop]")) return; return openProduct(d.p); }
  if (d.cat && el.classList.contains("chip")) { hap("sel"); return toCat(d.cat); }
  if (d.tab) { hap("sel"); if (d.tab === S.view && d.tab === "home") return window.scrollTo({top: 0, behavior: "smooth"}); return go(d.tab); }
  if (d.pay) { S.payment = d.pay; hap("sel"); $$("[data-pay]").forEach(b => b.classList.toggle("on", b === el)); return checkLimit(); }
  if (d.date) { S.date = d.date; hap("sel"); $$("[data-date]").forEach(b => b.classList.toggle("on", b === el)); return; }
  if (d.lang) return setLang(d.lang);
});
document.addEventListener("change", e => { const i = e.target.closest("[data-qi]"); if (!i) return; const [pid, u] = i.dataset.qi.split("|"); setQty(pid, u, clampQ(i.value.replace(/\D/g, ""))); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-qi]")) e.target.blur(); if ((e.key === "Enter" || e.key === " ") && e.target.matches(".pr[data-p]")) { e.preventDefault(); openProduct(e.target.dataset.p); } if (e.key === "Escape") back(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) return; if (S.view === "orders") loadOrders(true); if (S.view === "ledger") loadLedger(); if (!S.demo && S.view === "home") { reloadMenu(); refreshAcc().then(() => S.view === "home" && !$(".modal") && render()); } });
boot().catch(err => { console.error(err); if (FALLBACK) { applyMenu(FALLBACK); S.demo = true; S.user = {tg_id: 0, name: "Mehmon", shop: "Demo"}; S.acc = {balance: 0, days: [], dates: demoDates({})}; i18nStatic(); go("home", true); } splashOff(); });
