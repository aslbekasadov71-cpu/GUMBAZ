<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ulgurji buyurtma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Ulgurji design system — flat, Manrope, tint chiplar; asosiy rang logotipdan.
   Layout: bitta ustun, max 560px, pastki navigatsiya; kartalar soyasiz, 18px burchak. */
:root{
  --bg:#f2f4f7; --card:#fff; --ink:#101828; --mute:#8a94a6; --line:#e6e9ef;
  --b:#1d5bd8; --bd:#0f2f6e; --bl:#e8effc;
  --g:#f5b301; --gd:#8a5a00; --gl:#fff4d6;
  --red:#f04438; --redl:#fee4e2; --ok:#12b76a; --okl:#dcfae6; --warn:#dc6803; --warnl:#fef0c7;
  --photo:#f4f4f3;
  --font:Manrope,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%;background:var(--bg)}
body{font:500 16px/1.4 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
.ic{width:22px;height:22px;flex:none;display:inline-block;vertical-align:middle}
.ic.s{width:18px;height:18px}.ic.xs{width:16px;height:16px}.ic.l{width:28px;height:28px}.ic.xl{width:38px;height:38px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h2{font-size:14px;font-weight:700;margin:20px 0 8px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.mute{color:var(--mute)}.blue{color:var(--b)}.red{color:var(--red)}.okc{color:#16a34a}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 16px}
.top .grow{min-width:0;flex:1}

.pill{background:var(--bl);color:var(--b);font-weight:700;font-size:13px;padding:8px 12px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;border:0;white-space:nowrap}
.pill.red{background:var(--redl);color:var(--red)}
.pill.gold{background:var(--gl);color:var(--gd)}

input,textarea,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);outline:0;transition:border-color .15s}
textarea{resize:none}
input:focus,textarea:focus,select:focus{border-color:var(--b)}
input::placeholder,textarea::placeholder{color:#a7b0bf}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;transition:border-color .15s}
.field:focus-within{border-color:var(--b)}
.field input{border:0;background:none;padding:14px 0;min-width:0}
.field>.ic{color:var(--b)}
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:12px 2px 6px}

.btn{font-weight:700;border-radius:14px;padding:14px 16px;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),opacity .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.b{background:var(--b);color:#fff;border-color:var(--b)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.red{background:var(--redl);color:var(--red);border-color:var(--redl)}
.btn.soft{background:var(--bl);color:var(--b);border-color:var(--bl)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.full{width:100%}.btn.sm{padding:9px 12px;font-size:14px;border-radius:11px}
.link{background:none;border:0;color:var(--b);font-weight:700;padding:10px;width:100%;text-align:center}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1;min-width:0}.row>.auto{flex:none}

.card{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;transition:transform .12s var(--ease)}
button.card:active,.card.tap:active{transform:scale(.99)}
.card>.grow{flex:1;min-width:0}
.card b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.card small{overflow:hidden;text-overflow:ellipsis}
.box{background:var(--card);border-radius:18px;padding:14px;margin-bottom:8px}
.ico{width:44px;height:44px;border-radius:13px;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none}
.ico.red{background:var(--redl);color:var(--red)}.ico.gold{background:var(--gl);color:var(--gd)}.ico.okb{background:var(--okl);color:#079455}
.ico.im{position:relative;overflow:hidden;background:var(--photo)}
.ico.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.right{text-align:right;flex:none;font-weight:800}
.chev{color:#c3cad6;flex:none}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bl);color:var(--b);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.new{background:var(--warnl);color:var(--warn)}
.tag.accepted{background:var(--gl);color:var(--gd)}
.tag.on_way{background:var(--bl);color:var(--b)}
.tag.debt{background:var(--redl);color:var(--red)}.tag.cash{background:var(--okl);color:#079455}
.tag.done{background:var(--okl);color:#079455}
.tag.cancelled{background:var(--redl);color:var(--red)}
.tag.off{background:#eef0f4;color:var(--mute)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{font-weight:700;font-size:14px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;display:flex;align-items:center;gap:6px;transition:background .18s,color .18s,border-color .18s}
.chip.on{background:var(--bl);color:var(--b);border-color:var(--bl)}
.chip .n{font-size:12px;background:var(--b);color:#fff;border-radius:99px;padding:0 6px;min-width:18px;text-align:center}

.qty{display:flex;align-items:center;gap:2px;flex:none;background:var(--bg);border-radius:12px;padding:4px}
.qty button{background:none;border:0;color:var(--b);padding:4px;display:grid;place-items:center;border-radius:8px}
.qty button:active{background:var(--bl)}
.qty b{min-width:28px;text-align:center;font-size:16px;font-weight:800}

.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;font-size:14px;font-weight:700;border:0;background:none;color:var(--mute);padding:10px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;transition:background .18s,color .18s}
.seg button small{font-size:12px;color:inherit;opacity:.85}
.seg button.on{background:var(--b);color:#fff}

.stat{background:linear-gradient(135deg,var(--bd) 0%,var(--b) 100%);color:#fff;border-radius:22px;padding:18px;margin-bottom:10px;position:relative;overflow:hidden}
.stat::before,.stat::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.stat::before{right:-50px;top:-60px;width:180px;height:180px}.stat::after{right:40px;bottom:-70px;width:120px;height:120px}
.stat small{color:rgba(255,255,255,.78)}
.stat .big{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.02em;position:relative;z-index:1}
.stat .sp{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.stat .sp div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:9px 11px;min-width:0}
.stat .sp b{font-size:16px;font-weight:800;white-space:nowrap;display:block}
.stat .sp small{font-size:12px}
.dtiles{display:flex;gap:8px;margin-bottom:8px}
.dtile{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;min-width:0}
.dtile small{display:flex;align-items:center;gap:5px}
.dtile b{display:block;font-size:18px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--warnl);color:#8a4a00}
.banner.info{background:var(--bl);color:var(--bd)}
.banner.bad{background:var(--redl);color:var(--red)}
.banner small{color:inherit;font-weight:600;opacity:.85}
.codebox{font:800 34px/1 var(--font);letter-spacing:.06em;text-align:center;background:var(--card);border-radius:18px;padding:20px;user-select:all}
.empty{text-align:center;color:var(--mute);padding:44px 16px}
.empty .ei{width:76px;height:76px;border-radius:24px;background:var(--bl);color:var(--b);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:800;margin-bottom:4px}
.sw{width:46px;height:28px;border-radius:99px;background:#d0d5dd;position:relative;flex:none;transition:background .2s;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s var(--ease);box-shadow:0 1px 3px rgba(16,24,40,.2)}
.sw.on{background:var(--b)}.sw.on::after{left:21px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line span:first-child{color:var(--mute)}
.line.total{font-size:18px;font-weight:800}.line.total span:first-child{color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:30}
nav.tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;position:relative;transition:color .18s}
nav.tabs button.on{color:var(--b)}
nav.tabs .bdg{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}

.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:flex-end;z-index:70;animation:fade .2s ease-out}
.modal>.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;animation:up .28s var(--ease);overscroll-behavior:contain}
.modal.out{animation:fadeout .2s forwards}.modal.out>.sheet{animation:down .22s var(--ease) forwards}
.grab{width:40px;height:5px;border-radius:5px;background:#d0d5dd;margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes slide{from{opacity:0;transform:translateX(18px)}}
.view{animation:slide .26s var(--ease)}
.rise{animation:rise .34s var(--ease) both}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translate(-50%,-160%);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;z-index:100;display:flex;align-items:center;gap:6px;max-width:92%;transition:transform .3s var(--ease)}
#toast.show{transform:translate(-50%,0)}
.skel{background:linear-gradient(90deg,#e9edf2 0%,#f5f7fa 50%,#e9edf2 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
img.fade{opacity:0;transition:opacity .35s}
img.fade.ld{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── do'konchi ilovasi ── */
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app.withcart{padding-bottom:calc(176px + env(safe-area-inset-bottom,0px))}
.app.nonav{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.hi{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.hi .logo{width:46px;height:46px;border-radius:50%;flex:none}
.hi .who{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.hi .who small{display:flex;align-items:center;gap:4px}
.hi .who b{display:flex;align-items:center;gap:2px;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden}
.hi .who b span{overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;background:var(--bl);color:var(--b);display:grid;place-items:center;font-weight:800;font-size:17px;overflow:hidden;flex:none;border:0;padding:0}
.av img{width:100%;height:100%;object-fit:cover}
.qinfo{display:flex;gap:8px;margin-bottom:12px}
.qinfo button{flex:1;min-width:0;border:0;border-radius:16px;padding:10px 12px;text-align:left;background:var(--card);display:flex;gap:10px;align-items:center}
.qinfo .ico{width:36px;height:36px;border-radius:11px}
.qinfo b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.qinfo small{font-size:12px}
.qinfo .debt b{color:var(--red)}
.closed{margin-bottom:12px}
/* banners */
.bwrap{margin:12px -14px 0}
.btrack{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 14px;scroll-padding:0 14px}
.btrack::-webkit-scrollbar{display:none}
.bs{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:2/1;border-radius:22px;overflow:hidden;background:var(--bd);position:relative;border:0;padding:0;max-width:100%}
.bs img,.bs video{width:100%;height:100%;object-fit:cover;display:block}
.bs .vt{position:absolute;left:10px;top:10px;background:rgba(16,24,40,.45);color:#fff;border-radius:99px;padding:3px 9px 3px 5px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px;backdrop-filter:blur(6px)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:6px;background:#d0d5dd;transition:width .3s var(--ease),background .3s}
.dots i.on{width:20px;background:var(--b)}
.catbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:6px -14px 0;padding:10px 14px}
.catbar.stuck{box-shadow:0 8px 16px -12px rgba(16,24,40,.25)}
.sec{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.sec h3{margin:16px 2px 10px;display:flex;align-items:center;gap:8px}
.sec h3 .n{font-size:13px;color:var(--mute);font-weight:700}
/* product rows */
.pr{background:var(--card);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:8px;position:relative;cursor:pointer;transition:transform .12s var(--ease)}
.pr:active{transform:scale(.99)}
.pr .pi{width:76px;height:76px;border-radius:14px;flex:none;position:relative;overflow:hidden;background:var(--photo)}
.pr .pi img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{position:absolute;inset:0;display:grid;place-items:center;background:hsl(var(--h,215) 80% 95%);color:hsl(var(--h,215) 65% 45%)}
.noimg b{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.noimg.big .ic{width:64px;height:64px}.noimg.big b{font-size:13px;bottom:12px}
.pr .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pr .nm{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr .pk{font-size:12.5px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:4px}
.pr .pp{font-size:16px;font-weight:800;white-space:nowrap;margin-top:2px}
.pr .pp small{display:inline;font-size:12px;font-weight:600}
.pr .ctl{flex:none;align-self:flex-end;display:flex;flex-direction:column;align-items:center;gap:3px}
.addb{width:40px;height:40px;border-radius:13px;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none;border:0;padding:0;transition:transform .15s var(--ease),background .15s}
.addb:active{transform:scale(.88)}
.vq{display:flex;flex-direction:column;align-items:center;background:var(--bl);border-radius:13px;padding:3px}
.vq button{border:0;background:none;color:var(--b);width:34px;height:28px;display:grid;place-items:center;border-radius:9px}
.vq button:active{background:#d5e2fb}
.vq b{font-size:15px;font-weight:800;color:var(--b);min-width:30px;text-align:center;line-height:1.1}
.vq small{font-size:10px;font-weight:700;color:var(--b);opacity:.8;line-height:1}
.badge{position:absolute;left:5px;top:5px;z-index:1;font-size:10.5px;font-weight:800;padding:2px 7px 2px 5px;border-radius:99px;display:flex;align-items:center;gap:2px;background:var(--gl);color:var(--gd)}
.badge.new{background:var(--okl);color:#079455}.badge.sale{background:var(--redl);color:var(--red)}
.pr.off{opacity:.55}.pr.off .ctl{display:none}
.pr .soldout{font-size:12px;font-weight:800;color:var(--red)}
/* cart slab */
.slab{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 max(14px,env(safe-area-inset-left,0px));pointer-events:none;animation:rise .3s var(--ease)}
.slab>div{max-width:532px;margin:0 auto;background:var(--card);border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(16,24,40,.14);pointer-events:auto}
.slab small{font-size:12.5px}
.slab b{font-size:20px;font-weight:800;display:block;letter-spacing:-.01em}
.slab .btn{flex:none;padding:13px 18px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(16,24,40,.08);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot>div{max-width:528px;margin:0 auto}
.srow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:15px;color:var(--mute);font-weight:600}
.srow b{font-size:22px;font-weight:800;color:var(--ink)}
/* product sheet */
.pimg{aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--photo);margin-bottom:14px;max-width:100%;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.sheet h1{margin-bottom:6px;font-size:23px}
.sheet .desc{color:var(--mute);margin-bottom:12px;font-size:14px}
.useg button b{font-size:14.5px}
.qbig{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:8px;margin-top:10px}
.qbig button.st{width:48px;height:48px;border-radius:13px;border:0;background:var(--bl);color:var(--b);display:grid;place-items:center;flex:none}
.qbig input{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:800;border:0;padding:6px;background:none}
.qchips{display:flex;gap:6px;margin-top:8px}
.qchips button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 0;font-weight:800;font-size:14px;color:var(--b)}
.qsum{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 10px;color:var(--mute);font-weight:600;font-size:14px}

.ci{align-items:center}

.dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.opt{border:2px solid transparent;transition:border-color .18s}
.opt.on{border-color:var(--b)}

.okc-ring{width:96px;height:96px;border-radius:50%;background:var(--okl);color:#079455;display:grid;place-items:center;margin:30px auto 18px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

/* profile / ledger */

.terms h3{font-size:16px;margin:18px 0 6px}
.zl button{margin-bottom:8px}
/* map — o'zimizning yengil xarita (Leaflet'siz) */
#mapLayer{position:fixed;inset:0;z-index:50;background:#eef1ec;overflow:hidden;animation:fade .25s}

.gt{position:absolute;left:0;top:0;width:256px;height:256px;transform-origin:0 0;opacity:0;transition:opacity .3s ease;filter:saturate(.82) contrast(.97) brightness(1.03);pointer-events:none;-webkit-user-drag:none;max-width:none!important}
.gt.ld{opacity:1}
.mbx .gt{filter:none}
.mapfb{position:absolute;left:24px;right:24px;top:calc(90px + env(safe-area-inset-top,0px));z-index:4;background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 8px 24px rgba(16,24,40,.12)}

.mtitle{flex:1;min-width:0;text-align:center;font-weight:800;font-size:17px;letter-spacing:-.01em}
.mstyle{display:flex;background:var(--card);border-radius:14px;padding:3px;box-shadow:0 6px 18px rgba(16,24,40,.14)}
.mstyle button{border:0;background:none;font-weight:800;font-size:12.5px;color:var(--mute);padding:9px 10px;border-radius:11px;transition:background .2s,color .2s}
.mstyle button.on{background:var(--b);color:#fff}
.mtop .ph{width:46px;flex:none}
#mapLayer.sat .mshade{background:linear-gradient(180deg,rgba(16,24,40,.45),rgba(16,24,40,0))}
#mapLayer.sat .mtitle{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.rbtn{width:46px;height:46px;border-radius:15px;background:var(--card);color:var(--ink);display:grid;place-items:center;border:0;box-shadow:0 6px 18px rgba(16,24,40,.14);transition:transform .15s var(--ease)}

.mctl{position:absolute;right:max(14px,env(safe-area-inset-right,0px));z-index:6;display:flex;flex-direction:column;gap:10px;transition:bottom .35s var(--ease),opacity .25s}
.mzoom{background:var(--card);border-radius:15px;box-shadow:0 6px 18px rgba(16,24,40,.14);overflow:hidden;display:flex;flex-direction:column}

.mzoom button:active{background:var(--bg)}

@keyframes spin{to{transform:rotate(360deg)}}
.mattr{position:absolute;left:max(10px,env(safe-area-inset-left,0px));z-index:5;font-size:10px;font-weight:600;color:#5d6b7e;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:6px;transition:bottom .35s var(--ease)}

.pinw{position:absolute;left:50%;z-index:5;pointer-events:none;width:0;height:0}
.pinb{position:absolute;left:-24px;top:-62px;width:48px;height:60px;transition:transform .32s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 8px 10px rgba(15,47,110,.35))}
.pinw.lift .pinb{transform:translateY(-16px) scale(1.05);transition:transform .22s var(--ease)}
.pinw.drop .pinb{animation:pdrop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pdrop{0%{transform:translateY(-16px)}55%{transform:translateY(2px) scaleY(.92)}100%{transform:none}}
.pshadow{position:absolute;left:-9px;top:-4px;width:18px;height:7px;border-radius:50%;background:rgba(16,24,40,.32);transition:transform .25s var(--ease),opacity .25s}
.pinw.lift .pshadow{transform:scale(.55);opacity:.45}
.pring{position:absolute;left:-28px;top:-14px;width:56px;height:28px;border-radius:50%;border:2px solid var(--b);opacity:0}
.pinw.drop .pring{animation:pring .9s ease-out}
@keyframes pring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.pbub{position:absolute;left:50%;top:-104px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;padding:6px 10px;border-radius:99px;white-space:nowrap;transition:opacity .2s,transform .25s var(--ease)}
.pbub::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:1px}

/* markers */
.rmk{position:absolute;left:0;top:0;width:0;height:0}
.rmk>div{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(16,24,40,.25);display:grid;place-items:center}
.rmk img{width:38px;height:38px;border-radius:50%}

.rmk i,.udot i{position:absolute;border-radius:50%;animation:rpulse 2.4s ease-out infinite}
.rmk i{left:-22px;top:-22px;width:44px;height:44px;background:rgba(29,91,216,.35)}
@keyframes rpulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}

.udot>span{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#2b6cf6;border:3px solid #fff;box-shadow:0 2px 8px rgba(43,108,246,.5)}
.udot i{left:-8px;top:-8px;width:16px;height:16px;background:rgba(43,108,246,.35)}

.msheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -12px 34px rgba(16,24,40,.16);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:transform .35s var(--ease);animation:up .4s var(--ease)}
.msheet>div{max-width:528px;margin:0 auto}
#mapLayer.moving .msheet{transform:translateY(calc(100% - 112px - env(safe-area-inset-bottom,0px)))}
#mapLayer.moving .mctl{opacity:.0;pointer-events:none}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.mhead h3{font-size:19px}
.mstreet{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 12px;transition:border-color .15s}
.mstreet:focus-within{border-color:var(--b)}
.mstreet .ico{width:38px;height:38px;border-radius:12px}
.mstreet input{border:0;padding:10px 0;background:none;font-weight:700;min-width:0;flex:1}
.mstreet input.loading{background:linear-gradient(90deg,#e9edf2 0%,#f7f8fa 50%,#e9edf2 100%);background-size:200% 100%;animation:sk 1.1s infinite linear;border-radius:8px;color:transparent}
.mstreet.bad{border-color:var(--red);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.mgrid label{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px 2px;transition:border-color .15s}
.mgrid label:focus-within{border-color:var(--b)}
.mgrid small{font-size:11.5px;font-weight:700}
.mgrid input{border:0;padding:2px 0 6px;background:none;font-weight:700}
.mland{margin-bottom:10px}
.gmap.ymode{touch-action:auto;cursor:default;background:#eef1ec}
.ybox{position:absolute;left:0;right:0;top:0;height:100%}
.ymode~.mattr,#mapLayer:has(.ymode) .mattr{display:none}

#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .35s}

@keyframes breathe{50%{transform:scale(1.06)}}
#splash.hide{opacity:0;pointer-events:none}

    bt.onclick = () => { const v = mapStyle(bt.dataset.ms); hap("sel"); $$("#mstyle button").forEach(x => x.classList.toggle("on", x === bt)); el.classList.toggle("sat", v === "sat"); if (map.yandex) map.setType(v); else map.setTiles(tileFn(mbx, v)); }; });
  $("#msave").onclick = saveAddr;
  $("#ma").addEventListener("input", () => $("#mst").classList.remove("bad"));
  $("#ma").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#m_land").focus(); } });
  $("#m_land").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
  setTimeout(() => { pin.classList.add("drop"); onPin(true); }, 60);
  if (!has) locate();
}
function closeMap() { const m = $("#mapLayer"); if (MP) clearTimeout(MP.gT); if (MP && MP.map) MP.map.destroy(); MP = null; if (m) { m.style.transition = "opacity .2s"; m.style.opacity = "0"; setTimeout(() => m.remove(), 200); } setTimeout(updBack, 0); }
function onPin(initial) {
  if (!MP) return; const map = MP.map; MP.lat = map.lat; MP.lon = map.lon;
  if (initial && $("#ma").value.trim()) return;
  const inp = $("#ma"), cur = inp.value.trim(), canFill = !cur || cur === MP.sug;
  clearTimeout(MP.gT); if (canFill) inp.classList.add("loading");
  MP.gT = setTimeout(async () => {
    if (!MP) return;
    const my = ++MP.req; let a = "";
    if (!S.demo) { const res = await api("geocode", {lat: MP.lat, lon: MP.lon, lang: S.lang}); if (res.ok) a = res.address; }
    if (!MP || my !== MP.req) return;
    inp.classList.remove("loading");
    if (a && !/^-?\d+\.\d+,/.test(a)) { const now = inp.value.trim(); if (!now || now === MP.sug) inp.value = a; MP.sug = a; }
  }, 420);
}
function locate() {
  hap(); const b = $("#mgps"); b && b.classList.add("busy");
  const done = () => b && b.classList.remove("busy");
  const goTo = (a, c) => { done(); if (!MP) return; MP.map.flyTo(a, c, 17, 900);
    if (!MP.udot) { const d = document.createElement("div"); d.className = "udot"; d.innerHTML = "<i></i><span></span>"; MP.udot = MP.map.addMarker(a, c, d); } else { MP.udot.lat = a; MP.udot.lon = c; } };
  const fail = () => { done(); toast(t("gpsErr"), "danger"); };
  const br = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => goTo(p.coords.latitude, p.coords.longitude), fail, {enableHighAccuracy: true, timeout: 12000, maximumAge: 30000}) : fail();
  const lm = tg && tg.LocationManager;
  if (lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) lm.init(() => { if (!lm.isLocationAvailable) return br(); lm.getLocation(d => { if (d) goTo(d.latitude, d.longitude); else if (lm.isAccessRequested && !lm.isAccessGranted) { done(); lm.openSettings(); } else br(); }); });
  else br();
}
async function saveAddr() {
  if (!MP) return;
  const street = $("#ma").value.trim();
  if (street.length < 3) { const st = $("#mst"); st.classList.remove("bad"); void st.offsetWidth; st.classList.add("bad"); hap("err"); toast(t("streetNeed"), "danger"); return $("#ma").focus(); }
  const body = {lat: MP.map.lat, lon: MP.map.lon, address: street, landmark: $("#m_land").value.trim()};
  const b = $("#msave"); b.disabled = true;
  if (S.demo) { Object.assign(S.user, body); store.set("demoUser", S.user); }
  else { const r = await api("address", body); if (!r.ok) { b.disabled = false; hap("err"); return toast(t("err"), "danger"); } S.user = r.user; if (r.account) S.acc = r.account; }
  if (S.demo) await refreshAcc();
  const ds = (S.acc.dates || []).map(d => d.date); if (!ds.includes(S.date)) S.date = ds[0] || null;
  hap("ok"); toast(t("saved")); closeMap(); render();
}

/* ───────── events ───────── */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-inc],[data-dec],[data-quick],[data-q],[data-p],[data-cat],[data-tab],[data-pay],[data-lang],[data-date],[data-reo],[data-oi]"); if (!el) return;
  const d = el.dataset;
  if (d.inc) { e.stopPropagation(); const p = P(d.inc); return bump(p.id, defUnit(p), 1); }
  if (d.dec) { e.stopPropagation(); const p = P(d.dec); return bump(p.id, defUnit(p), -1); }
  if (d.quick) { e.stopPropagation(); const p = P(d.quick); if (S.cart.some(c => c.pid === p.id) || sellUnits(p).length > 1) return openProduct(p.id); return bump(p.id, defUnit(p), 1); }
  if (d.q) { const [pid, u] = d.q.split("|"); return bump(pid, u, +d.d); }
  if (d.reo) { e.stopPropagation(); return reorder(+d.reo); }
  if (d.oi) return openOrder(+d.oi);
  if (d.p) { if (e.target.closest("[data-stop]")) return; return openProduct(d.p); }
  if (d.cat && el.classList.contains("chip")) { hap("sel"); return toCat(d.cat); }
  if (d.tab) { hap("sel"); if (d.tab === S.view && d.tab === "home") return window.scrollTo({top: 0, behavior: "smooth"}); return go(d.tab); }
  if (d.pay) { S.payment = d.pay; hap("sel"); $$("[data-pay]").forEach(b => b.classList.toggle("on", b === el)); return checkLimit(); }
  if (d.date) { S.date = d.date; hap("sel"); $$("[data-date]").forEach(b => b.classList.toggle("on", b === el)); return; }
  if (d.lang) return setLang(d.lang);
});
document.addEventListener("change", e => { const i = e.target.closest("[data-qi]"); if (!i) return; const [pid, u] = i.dataset.qi.split("|"); setQty(pid, u, clampQ(i.value.replace(/\D/g, ""))); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-qi]")) e.target.blur(); if ((e.key === "Enter" || e.key === " ") && e.target.matches(".pr[data-p]")) { e.preventDefault(); openProduct(e.target.dataset.p); } if (e.key === "Escape") back(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) return; if (S.view === "orders") loadOrders(true); if (S.view === "ledger") loadLedger(); if (!S.demo && S.view === "home") { reloadMenu(); refreshAcc().then(() => S.view === "home" && !$(".modal") && render()); } });
boot().catch(err => { console.error(err); if (FALLBACK) { applyMenu(FALLBACK); S.demo = true; S.user = {tg_id: 0, name: "Mehmon", shop: "Demo"}; S.acc = {balance: 0, days: [], dates: demoDates({})}; i18nStatic(); go("home", true); } splashOff(); });
